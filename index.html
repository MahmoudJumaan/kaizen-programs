
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كايزن | Kaizen</title>
    <!-- استدعاء خط "تجوال" الأنيق والحديث -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            /* خلفية متدرجة بألوان خضراء ناعمة تناسب الهوية النسائية */
            background: linear-gradient(135deg, #e8f5e9 0%, #a5d6a7 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* تصميم بطاقة زجاجية (Glassmorphism) تعطي طابع فخم */
        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 50px 30px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.1);
        }

        .brand-name {
            font-size: 3.2rem;
            color: #1b5e20;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #388e3c;
            font-size: 1.1rem;
            margin-top: 8px;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-sizing: border-box;
            gap: 10px;
        }

        /* زر تمارين البيت (أخضر صلب) */
        .btn-home {
            background-color: #2e7d32;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.25);
        }

        .btn-home:hover {
            background-color: #1b5e20;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(46, 125, 50, 0.35);
        }

        /* زر تمارين النادي (مفرغ مع حدود خضراء) */
        .btn-gym {
            background-color: transparent;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }

        .btn-gym:hover {
            background-color: rgba(46, 125, 50, 0.08);
            transform: translateY(-3px);
        }

        /* أيقونة التحميل */
        .icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="brand-name">كايزن</h1>
        <p class="subtitle">ابدئي رحلة التغيير، اختاري برنامجك الآن ✨</p>
        
        <!-- روابط التحميل (تمت إضافة خاصية download) -->
        <a href="home-workout.pdf" download class="btn btn-home">
            <span class="icon">⬇️</span> تحميل تمارين للبيت
        </a>
        
        <a href="gym-workout.pdf" download class="btn btn-gym">
            <span class="icon">⬇️</span> تحميل تمارين للنادي
        </a>
    </div>

</body>
</html>
