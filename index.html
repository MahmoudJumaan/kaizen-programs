<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كايزن للرجال | Kaizen</title>
    <!-- استدعاء خط "تجوال" -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            /* خلفية كحلية داكنة فخمة */
            background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* تصميم بطاقة زجاجية (Glassmorphism) داكنة */
        .card {
            background: rgba(17, 34, 64, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 50px 30px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .brand-name {
            font-size: 3.2rem;
            color: #FFD700; /* لون ذهبي */
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            text-shadow: 0 4px 10px rgba(255, 215, 0, 0.2);
        }

        .subtitle {
            color: #8892b0;
            font-size: 1.1rem;
            margin-top: 8px;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-sizing: border-box;
            gap: 10px;
        }

        /* زر تمارين البيت (ذهبي صلب) */
        .btn-home {
            background-color: #FFD700;
            color: #0a192f;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.15);
        }

        .btn-home:hover {
            background-color: #e6c200;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 215, 0, 0.25);
        }

        /* زر تمارين النادي (مفرغ مع حدود ذهبية) */
        .btn-gym {
            background-color: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
        }

        .btn-gym:hover {
            background-color: rgba(255, 215, 0, 0.08);
            transform: translateY(-3px);
        }

        /* أيقونة التحميل */
        .icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="brand-name">كايزن</h1>
        <p class="subtitle">ابدأ رحلة التغيير، اختر برنامجك الآن ⚡</p>
        
        <!-- روابط التحميل الخاصة بالرجال -->
        <a href="home-workout.pdf" download class="btn btn-home">
            <span class="icon">⬇️</span> تحميل تمارين للبيت
        </a>
        
        <a href="gym-workout.pdf" download class="btn btn-gym">
            <span class="icon">⬇️</span> تحميل تمارين للنادي
        </a>
    </div>

</body>
</html>
